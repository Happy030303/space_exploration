<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-css">
  :root {
    --space: #000000;
    --star: #ECE6DA;
    --muted: rgba(236, 230, 218, 0.66);
    --faint: rgba(236, 230, 218, 0.22);
    --ha: #E8505B;
    --o3: #63C7B2;
    --hud: rgba(4, 10, 14, 0.7);
    --hud-line: rgba(99, 199, 178, 0.32);
    --serif: 'Cormorant Garamond', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    --sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --cut: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
    --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* Space stays dark in every theme, on purpose */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --space: #000000; --star: #ECE6DA; } }
  :root[data-theme="dark"] { --space: #000000; --star: #ECE6DA; }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  html { height: 100%; background: var(--space); scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; height: 100%; overflow: hidden; background: var(--space); color: var(--star);
    font-family: var(--sans); font-size: 16px; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, [role=slider]:focus-visible, a:focus-visible { outline: 2px solid var(--star); outline-offset: 3px; }
  input[type=text], input[type=url], textarea { user-select: text; -webkit-user-select: text; }
  kbd { font: 700 0.68rem/1 var(--sans); padding: 2px 5px; border: 1px solid currentColor; border-radius: 3px; opacity: 0.85; margin-left: 2px; vertical-align: 1px; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#c.drag { cursor: grabbing; }

  /* ---------- in-world overlays ---------- */
  #markers { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .mk { position: absolute; left: 0; top: 0; display: none; align-items: center; gap: 7px; pointer-events: auto;
    font-size: 0.76rem; color: var(--star); white-space: nowrap; text-shadow: 0 1px 5px #000, 0 0 2px #000; padding: 3px 6px 3px 0; }
  .mk .ring { width: 10px; height: 10px; border: 1.5px solid rgba(236,230,218,0.8); border-radius: 50%; margin-left: -5px; flex: none; }
  .mk .t { opacity: 0.82; }
  .mk:hover .t { opacity: 1; }
  .mk.bbm .ring { border-radius: 1px; border-color: var(--o3); }
  #brackets { position: fixed; left: 0; top: 0; width: 60px; height: 60px; pointer-events: none; display: none; }
  #brackets i { position: absolute; width: 14px; height: 14px; border: 0 solid var(--o3); }
  #brackets i:nth-child(1) { left: 0; top: 0; border-width: 2px 0 0 2px; }
  #brackets i:nth-child(2) { right: 0; top: 0; border-width: 2px 2px 0 0; }
  #brackets i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 2px 2px; }
  #brackets i:nth-child(4) { right: 0; bottom: 0; border-width: 0 2px 2px 0; }
  #brackets.lock i { border-color: var(--ha); }
  #brLabel { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 7px; text-align: center;
    font-size: 0.74rem; line-height: 1.35; white-space: nowrap; text-shadow: 0 1px 6px #000, 0 0 2px #000; }
  #brLabel b { display: block; font-weight: 600; font-size: 0.8rem; }
  #brLabel span { color: var(--o3); font-variant-numeric: tabular-nums; }
  #brackets.lock #brLabel span { color: var(--ha); }
  #brackets.top #brLabel { top: auto; bottom: 100%; margin: 0 0 7px; }
  #edgeArrow { position: fixed; left: 0; top: 0; width: 0; height: 0; display: none; pointer-events: none;
    border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 16px solid var(--ha); filter: drop-shadow(0 0 6px rgba(232,80,91,0.8)); }
  #cockpit { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity 0.5s; }
  body.no-cockpit #cockpit { opacity: 0; }
  #reticle { position: fixed; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; pointer-events: none;
    border: 1px solid rgba(99,199,178,0.45); border-radius: 50%; }
  #reticle::before, #reticle::after { content: ""; position: absolute; background: rgba(99,199,178,0.7); }
  #reticle::before { left: 50%; top: -8px; width: 1px; height: 6px; }
  #reticle::after { top: 50%; left: -8px; width: 6px; height: 1px; box-shadow: 34px 0 0 rgba(99,199,178,0.7); }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, rgba(235,240,255,1) 0%, rgba(170,195,255,0.55) 35%, rgba(0,0,0,0) 75%); }
  #alert { position: fixed; left: 50%; top: 31%; transform: translateX(-50%); padding: 6px 16px; pointer-events: none; display: none;
    font: 700 0.9rem var(--sans); letter-spacing: 0.03em; color: var(--ha); border: 1px solid var(--ha); background: rgba(40,6,10,0.6); animation: blink 1.1s steps(2) infinite; }
  #alert.on { display: block; }
  @keyframes blink { 50% { opacity: 0.35; } }

  /* ---------- HUD ---------- */
  .hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1s ease; }
  .hud.live { opacity: 1; }
  .hud button, .hud [role=slider], .hud canvas { pointer-events: auto; }
  .hp { background: var(--hud); border: 1px solid var(--hud-line); clip-path: var(--cut); }
  .lbl { font-size: 0.7rem; font-weight: 700; color: var(--o3); letter-spacing: 0.02em; }

  .pilot { position: absolute; top: calc(var(--st) + 14px); left: calc(var(--sl) + 16px); display: grid; gap: 6px; padding: 10px 16px 11px; min-width: 230px; text-align: left; }
  .pilot:hover { border-color: rgba(99,199,178,0.6); }
  .rank-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .rank { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 1.3rem; line-height: 1; }
  .xpbar { height: 4px; background: rgba(236,230,218,0.12); position: relative; overflow: hidden; }
  .xpbar b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--o3), #b8f3e6); transition: width 0.6s ease; }
  .pilot-sub { display: flex; justify-content: space-between; gap: 14px; font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #xpPop { position: absolute; top: calc(var(--st) + 22px); left: calc(var(--sl) + 262px); font: 700 0.85rem var(--sans); color: var(--o3);
    opacity: 0; white-space: nowrap; pointer-events: none; text-shadow: 0 1px 6px #000; }
  #xpPop.go { animation: pop 1.7s ease forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }

  .menu { position: absolute; top: calc(var(--st) + 14px); right: calc(var(--sr) + 16px); display: flex; gap: 8px; }
  .vis { display: flex; align-items: baseline; gap: 6px; padding: 10px 14px; font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .vis b { color: var(--star); font-weight: 700; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .menu-stats { display: flex; gap: 28px; margin: 6px 0 4px; font-size: 0.8rem; color: var(--muted); }
  .menu-stats b { display: block; margin-top: 2px; font-size: 1.35rem; font-weight: 700; color: var(--star); font-variant-numeric: tabular-nums; }
  .intro-vis { margin: 14px 0 0; font-size: 0.86rem; color: var(--muted); }
  .intro-vis b { color: var(--o3); font-weight: 700; font-variant-numeric: tabular-nums; }
  .mbtn { padding: 10px 16px; font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
  .mbtn:hover { border-color: rgba(99,199,178,0.7); background: rgba(10,30,34,0.8); }

  #toasts { position: absolute; left: 50%; top: calc(var(--st) + 14px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: max-content; max-width: min(440px, calc(100vw - 620px)); min-width: 240px; }
  .toast { padding: 9px 14px; background: rgba(4,10,14,0.88); border: 1px solid var(--hud-line); border-left: 3px solid var(--o3);
    font-size: 0.84rem; line-height: 1.45; animation: tin 0.35s ease both; }
  .toast.major { border-left-color: var(--ha); }
  .toast b { font-weight: 700; }
  .toast.out { animation: tout 0.5s ease both; }
  @keyframes tin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @keyframes tout { to { opacity: 0; transform: translateY(-6px); } }

  .flight { position: absolute; left: calc(var(--sl) + 16px); bottom: calc(var(--sb) + 16px); display: flex; align-items: stretch; gap: 14px; padding: 14px 16px 14px 14px; }
  .throttle { --t: 0; position: relative; width: 30px; height: 172px; background: rgba(236,230,218,0.06); border: 1px solid rgba(236,230,218,0.2); cursor: ns-resize; touch-action: none; }
  .th-fill { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--t) * 100%); background: linear-gradient(to top, #2f8f7f, var(--o3) 55%, #f0a0a6 85%, var(--ha)); opacity: 0.9; }
  .th-ticks { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to top, transparent 0 calc(10% - 1px), rgba(0,0,0,0.6) calc(10% - 1px) 10%); }
  .th-knob { position: absolute; left: -6px; right: -6px; height: 4px; bottom: calc(var(--t) * 100%); transform: translateY(50%); background: var(--star); box-shadow: 0 0 8px rgba(236,230,218,0.9); }
  .flight-read { display: flex; flex-direction: column; justify-content: space-between; min-width: 132px; }
  .spd { margin-top: 2px; white-space: nowrap; }
  .spd b { font: 600 2.3rem/1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .spd span { font-size: 0.95rem; color: var(--muted); margin-left: 4px; }
  .sub { font-size: 0.74rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 4px; }
  .boost { align-self: flex-start; margin-top: 6px; font: 700 0.68rem var(--sans); color: #021012; background: var(--o3); padding: 2px 7px; visibility: hidden; }
  .boost.on { visibility: visible; }
  .sbtn { margin-top: 8px; align-self: flex-start; padding: 6px 11px; font-size: 0.76rem; font-weight: 600; border: 1px solid rgba(236,230,218,0.28); }
  .sbtn:hover { border-color: rgba(236,230,218,0.6); }

  .target { position: absolute; left: 50%; bottom: calc(var(--sb) + 16px); transform: translateX(-50%); width: min(520px, calc(100vw - 560px)); padding: 12px 18px 14px; }
  .tg-head { display: flex; justify-content: space-between; gap: 12px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em; }
  .tg-type { color: var(--o3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tg-type span { color: var(--muted); font-weight: 500; }
  .tg-dist { color: var(--star); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .target h2 { margin: 3px 0 5px; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 1.8rem; line-height: 1.05;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .target p { margin: 0; font-size: 0.83rem; line-height: 1.45; color: rgba(236,230,218,0.86);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tg-row { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .tg-eta { margin-left: auto; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .go { padding: 8px 14px; background: var(--o3); color: #021012; font-weight: 700; font-size: 0.82rem; white-space: nowrap; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  .go:hover { background: #86dcc9; }
  .go.on { background: var(--ha); color: #fff; }
  .go kbd { border-color: rgba(0,0,0,0.45); }
  .hb { padding: 7px 12px; border: 1px solid rgba(236,230,218,0.3); font-size: 0.8rem; white-space: nowrap; }
  .hb:hover { border-color: rgba(236,230,218,0.6); background: rgba(236,230,218,0.05); }
  .ad-open { display: none; }
  .ad-open.on { display: inline-block; }

  .nav { position: absolute; right: calc(var(--sr) + 16px); bottom: calc(var(--sb) + 16px); display: flex; flex-direction: column; gap: 10px; width: 196px; }
  .radar-box { padding: 9px 9px 7px; }
  #radar { display: block; width: 176px; height: 176px; margin: 0 auto; cursor: default; }
  .radar-lbl { display: flex; justify-content: space-between; margin-top: 5px; font-size: 0.68rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .jump { position: relative; padding: 11px 14px 12px; font-weight: 700; font-size: 0.86rem; color: var(--o3); text-align: center; overflow: hidden; }
  .jump i { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--o3); transform-origin: left; transform: scaleX(1); }
  .jump.charging { color: var(--muted); }
  .jump.charging i { background: var(--muted); }
  .jump:hover { background: rgba(10,30,34,0.85); }

  /* ---------- panels ---------- */
  .panel { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,0.62); z-index: 20; padding: 20px; }
  .sheet { width: min(760px, 100%); max-height: 88vh; overflow: auto; background: #05090c; border: 1px solid var(--hud-line); clip-path: var(--cut); padding: 26px 28px; user-select: text; }
  .sheet h3 { margin: 0 0 6px; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 2.2rem; line-height: 1.05; }
  .sheet > p { margin: 0 0 18px; color: var(--muted); font-size: 0.9rem; line-height: 1.55; }
  .sheet .close { margin-top: 20px; }
  .log-head { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0 0 16px; font-size: 0.85rem; }
  .log-head b { display: block; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 1.5rem; }
  .log-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .log-item { padding: 10px 12px; border: 1px solid rgba(236,230,218,0.1); font-size: 0.85rem; line-height: 1.35; color: rgba(236,230,218,0.42); }
  .log-item small { display: block; font-size: 0.72rem; margin-top: 2px; }
  .log-item.found { color: var(--star); border-color: rgba(99,199,178,0.45); background: rgba(99,199,178,0.06); }
  .log-item.found::before { content: "✓ "; color: var(--o3); font-weight: 700; }
  .keys { display: grid; grid-template-columns: max-content 1fr; gap: 9px 20px; margin: 0; font-size: 0.9rem; }
  .keys dt { font-weight: 700; white-space: nowrap; }
  .keys dd { margin: 0; color: var(--muted); }
  .menu-sheet { width: min(380px, 100%); }
  .menu-list { display: grid; gap: 8px; margin-top: 14px; }
  .mi { padding: 12px 16px; text-align: left; font-weight: 600; font-size: 0.92rem; border: 1px solid rgba(236,230,218,0.16); display: flex; justify-content: space-between; gap: 12px; }
  .mi:hover { border-color: var(--o3); background: rgba(99,199,178,0.06); }
  .mi span { color: var(--o3); font-weight: 700; }
  .mi.primary { background: var(--o3); color: #021012; border-color: var(--o3); }

  .ads-sheet { width: min(880px, 100%); }
  .ad-form { display: grid; gap: 10px; padding: 16px; border: 1px solid rgba(236,230,218,0.12); margin-bottom: 12px; }
  .ad-form label.f { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .ad-form textarea, .ad-form input[type=url] { width: 100%; background: #0b1016; border: 1px solid rgba(236,230,218,0.2); color: var(--star);
    font: inherit; font-size: 0.92rem; padding: 9px 10px; resize: vertical; }
  .ad-form .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font-size: 0.88rem; }
  .ad-form .row .go { margin-left: auto; }
  .file-pick { position: relative; display: inline-flex; align-items: center; padding: 9px 14px; border: 1px dashed rgba(236,230,218,0.4); cursor: pointer; font-size: 0.85rem; }
  .file-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .file-pick:focus-within { outline: 2px solid var(--star); outline-offset: 3px; }
  #adPreview { max-width: 150px; max-height: 100px; border: 1px solid rgba(236,230,218,0.2); }
  .chk { display: flex; gap: 8px; align-items: center; font-size: 0.85rem; margin: 4px 0 14px; }
  .ad-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .ad-list .empty { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 0.88rem; }
  .ad-card { position: relative; border: 1px solid rgba(236,230,218,0.14); background: #0a0d12; font-size: 0.8rem; line-height: 1.4; overflow: hidden; }
  .ad-card img { display: block; width: 100%; height: 110px; object-fit: cover; }
  .ad-card .txt { padding: 8px 10px 10px; overflow-wrap: anywhere; }
  .ad-card .tag { display: block; font-size: 0.7rem; font-weight: 700; margin-bottom: 3px; color: var(--o3); }
  .ad-card .tag.ad { color: var(--ha); }
  .ad-card .lnk { margin-top: 4px; color: var(--muted); font-size: 0.72rem; }
  .ad-card .del { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,0.78); font-size: 0.85rem; }
  .ad-foot { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 16px; font-size: 0.82rem; color: var(--muted); }
  .ad-foot .go:disabled { opacity: 0.45; cursor: default; }
  .view-sheet { width: min(620px, 100%); }
  .view-sheet img { display: block; max-width: 100%; max-height: 58vh; margin: 0 auto 14px; }
  .view-sheet .cap { font-size: 1.05rem; line-height: 1.55; white-space: pre-wrap; margin: 0 0 16px; color: var(--star); }
  .view-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  a.go { text-decoration: none; display: inline-block; }

  /* ---------- title screen ---------- */
  #intro { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center;
    padding: calc(var(--st) + 24px) calc(var(--sr) + 24px) calc(var(--sb) + 24px) calc(var(--sl) + 24px);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.82) 72%); transition: opacity 0.9s ease; }
  #intro.gone { opacity: 0; pointer-events: none; }
  .title-wrap { max-width: 680px; }
  .kicker { margin: 0 0 8px; font-size: 0.85rem; font-weight: 700; color: var(--o3); letter-spacing: 0.02em; }
  #intro h1 { margin: 0 0 18px; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: clamp(3.2rem, 11vw, 8rem); line-height: 0.9; letter-spacing: -0.02em; text-shadow: 0 4px 40px rgba(0,0,0,0.6); }
  .lead { margin: 0 auto; max-width: 48ch; font-size: 1.02rem; line-height: 1.6; }
  .launch { margin-top: 26px; padding: 15px 40px; background: var(--star); color: #000; font-weight: 700; font-size: 1rem; clip-path: var(--cut); transition: background 0.2s, opacity 0.2s; }
  .launch:hover { background: #fff; }
  .launch:disabled { opacity: 0.6; cursor: progress; }
  .ctl-grid { margin: 26px auto 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 20px; font-size: 0.82rem; color: var(--muted); }
  .ctl-grid kbd { color: var(--star); margin-right: 3px; }
  .fine { margin: 18px auto 0; max-width: 54ch; font-size: 0.76rem; line-height: 1.5; color: rgba(236,230,218,0.5); }

  /* ---------- mid-size screens ---------- */
  @media (max-width: 1080px) and (min-width: 761px) and (min-aspect-ratio: 4/5) {
    .target { width: calc(100vw - 500px); }
    .nav { width: 166px; } #radar { width: 146px; height: 146px; }
    .flight-read { min-width: 112px; } .spd b { font-size: 1.9rem; }
  }
  /* ---------- phones / portrait ---------- */
  @media (max-width: 760px), (max-aspect-ratio: 4/5) {
    .pilot { top: calc(var(--st) + 10px); left: calc(var(--sl) + 10px); min-width: 0; padding: 8px 12px 9px; gap: 5px; }
    .rank { font-size: 1.05rem; }
    .pilot-sub { gap: 10px; font-size: 0.68rem; }
    #xpPop { top: calc(var(--st) + 74px); left: calc(var(--sl) + 14px); }
    .menu { top: calc(var(--st) + 10px); right: calc(var(--sr) + 10px); gap: 6px; }
    .mbtn { padding: 9px 11px; font-size: 0.78rem; }
    .menu .vis { display: none; }

const NOISE = `
uniform float uTime;
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p, int oct){
  float f=0.0, a=0.5;
  for(int i=0;i<8;i++){ if(i>=oct) break; f+=a*snoise(p); p*=2.02; a*=0.5; }
  return f;
}
vec3 perturb(vec3 pos, vec3 n, float h){
  vec3 sx=dFdx(pos); vec3 sy=dFdy(pos);
  vec3 r1=cross(sy,n); vec3 r2=cross(n,sx);
  float det=dot(sx,r1);
  vec3 grad=sign(det)*(dFdx(h)*r1+dFdy(h)*r2);
  return normalize(abs(det)*n-grad);
}
`;
const VS = `
varying vec3 vObj; varying vec3 vWorld; varying vec3 vN;
void main(){
  vObj=position;
  #ifdef USE_INSTANCING
    mat4 m=modelMatrix*instanceMatrix;
  #else
    mat4 m=modelMatrix;
  #endif
  vec4 w=m*vec4(position,1.0);
  vWorld=w.xyz;
  vN=normalize(mat3(m[0].xyz,m[1].xyz,m[2].xyz)*normal);
  gl_Position=projectionMatrix*viewMatrix*w;
}`;
function shader(frag, uniforms, opts) {
  return new THREE.ShaderMaterial(Object.assign({
    uniforms: Object.assign({ uTime: U_TIME }, uniforms || {}),
    vertexShader: VS, fragmentShader: NOISE + frag, extensions: { derivatives: true }
  }, opts || {}));
}

void main(){

  float t=uTime*0.04+uSeed;

/* Point clouds: one shader, shared scale uniform */
function pmat(o) {
  o = o || {};
  const m = new THREE.ShaderMaterial({
    uniforms: { uScale: U_SCALE, uOpacity: { value: o.opacity == null ? 1 : o.opacity }, uSoft: { value: o.soft || 0 } },
    vertexShader: `
      attribute float aSize; attribute float aAlpha; attribute vec3 aColor;
      uniform float uScale; uniform float uOpacity;
      varying vec3 vColor; varying float vAlpha;
      void main(){
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        float z=max(-mv.z,0.001);
        float ps=aSize*uScale/z;
        vAlpha=aAlpha*uOpacity*smoothstep(aSize*0.6,aSize*3.0,z);
        if(ps<1.2){ vAlpha*=ps/1.2; ps=1.2; }
        gl_PointSize=min(ps,500.0);
        vColor=aColor;
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader: `
      uniform float uSoft; varying vec3 vColor; varying float vAlpha;
      void main(){
        float d=length(gl_PointCoord-0.5)*2.0;
        if(d>1.0) discard;
        float hard=1.0-smoothstep(0.15,1.0,d); hard*=hard;
        float soft=exp(-d*d*3.2)*(1.0-d*d);
        gl_FragColor=vec4(vColor,mix(hard,soft,uSoft)*vAlpha);
      }`,
    transparent: true, depthWrite: false, blending: o.blending || THREE.AdditiveBlending
  });
  return m;
}
class PB {
  constructor() { this.p = []; this.s = []; this.a = []; this.c = []; }
  add(x, y, z, size, alpha, r, g, b) { this.p.push(x, y, z); this.s.push(size); this.a.push(alpha); this.c.push(r, g, b); }
  build(mat, order) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('aSize', new THREE.Float32BufferAttribute(this.s, 1));
    g.setAttribute('aAlpha', new THREE.Float32BufferAttribute(this.a, 1));
    g.setAttribute('aColor', new THREE.Float32BufferAttribute(this.c, 3));
    const pts = new THREE.Points(g, mat);

  }
}

/* ============ Background sky (never moves: it is "infinitely" far) ============ */
(function buildSky() {
  const rnd = mulberry32(7), g = gaussian(rnd);
  const N = Math.round(9000 * (small ? 0.7 : 1));
  const pos = [], size = [], col = [], ph = [];
  const bandN = V(0.3, 0.85, 0.42).normalize();
  const palette = [[0.75, 0.83, 1.0], [0.92, 0.94, 1.0], [1.0, 0.97, 0.9], [1.0, 0.86, 0.66], [1.0, 0.72, 0.55]];
  const v = V(0, 0, 0);
  for (let i = 0; i < N; i++) {
    v.set(g(), g(), g()).normalize();
    if (i < N * 0.45) { const d = v.dot(bandN); v.addScaledVector(bandN, -d * (1 - Math.abs(g()) * 0.12)).normalize(); }
    v.multiplyScalar(14000);
    pos.push(v.x, v.y, v.z);
    size.push(rnd() < 0.985 ? 0.7 + Math.pow(rnd(), 3) * 1.9 : 2.6 + rnd() * 1.6);
    const c = palette[Math.floor(Math.pow(rnd(), 1.4) * palette.length)], b = 0.45 + rnd() * 0.55;
    col.push(c[0] * b, c[1] * b, c[2] * b); ph.push(rnd());
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('aSize', new THREE.Float32BufferAttribute(size, 1));
  geo.setAttribute('aColor', new THREE.Float32BufferAttribute(col, 3));
  geo.setAttribute('aPhase', new THREE.Float32BufferAttribute(ph, 1));
  const pts = new THREE.Points(geo, new THREE.ShaderMaterial({
    uniforms: { uTime: U_TIME, uPR: { value: PR } },
    vertexShader: `attribute float aSize; attribute vec3 aColor; attribute float aPhase; uniform float uTime; uniform float uPR; varying vec3 vColor; varying float vA;
      void main(){ gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); gl_PointSize=aSize*uPR*1.6; vColor=aColor; vA=0.78+0.22*sin(uTime*(0.6+aPhase*1.8)+aPhase*40.0); }`,
    fragmentShader: `varying vec3 vColor; varying float vA; void main(){ float d=length(gl_PointCoord-0.5)*2.0; float a=1.0-smoothstep(0.0,1.0,d); gl_FragColor=vec4(vColor,a*a*vA); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  pts.frustumCulled = false; pts.renderOrder = -10; scene.add(pts);
  const band = new THREE.Mesh(new THREE.SphereGeometry(13000, 64, 32), new THREE.ShaderMaterial({
    uniforms: { uN: { value: bandN }, uTime: U_TIME },
    vertexShader: `varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader: NOISE + `uniform vec3 uN; varying vec3 vD;
      void main(){ float d=dot(vD,uN); float n=fbm(vD*3.0,5)*0.5+0.5;
        float band=exp(-pow(d/0.13,2.0))*(0.35+0.9*n);
        float dust=smoothstep(0.45,0.7,fbm(vD*6.0+4.0,4)*0.5+0.5)*exp(-pow(d/0.05,2.0));
        band*=1.0-dust*0.8;

        vec3 c=mix(vec3(0.35,0.36,0.6),vec3(0.95,0.85,0.7),n)*band*0.1+mix(vec3(0.5,0.1,0.25),vec3(0.1,0.3,0.45),fbm(vD*2.0,3)*0.5+0.5)*neb*0.05;
        gl_FragColor=vec4(c,1.0); }`,
    side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending

  for (let i = 0; i < 46; i++) {
    const d = randDir(g).multiplyScalar(12500);

/* ============ Space dust: shows motion everywhere ============ */
const dust = (function () {
  const N = small ? 380 : 650, B = 520, half = B / 2;
  const rnd = mulberry32(5);
  const xs = new Float32Array(N), ys = new Float32Array(N), zs = new Float32Array(N);
  const pos = new Float32Array(N * 6), col = new Float32Array(N * 6);
  for (let i = 0; i < N; i++) {
    xs[i] = (rnd() - 0.5) * B; ys[i] = (rnd() - 0.5) * B; zs[i] = (rnd() - 0.5) * B;
    const b = 0.35 + rnd() * 0.45;
    col[i * 6] = 0.75 * b; col[i * 6 + 1] = 0.82 * b; col[i * 6 + 2] = 1.0 * b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false });
  const lines = new THREE.LineSegments(geo, mat);
  lines.frustumCulled = false; lines.renderOrder = 40;
  scene.add(lines);
  const wrap = v => v - B * Math.floor((v + half) / B);
  return {
    update(dt, vel, speed) {
      const dx = vel.x * dt, dy = vel.y * dt, dz = vel.z * dt;
      const len = clamp(speed * 0.035, 0.25, 140);
      const inv = speed > 0.001 ? 1 / speed : 0;

  const kind = opts.star || pick(rnd, ['star_red', 'star_red', 'star_red', 'star_yellow', 'star_yellow', 'star_yellow', 'star_blue', 'star_redgiant', 'star_redgiant']);
  const spec = STAR_SPECS[kind];
  const sName = starName(rnd);
  const o = newObj('system', c, sName);
  const uLight = { value: V(0, 0, 0) };
  const star = makeStar(spec, rnd() * 10);
  o.group.add(star.group);
  addTarget(o, kind, sName, spec.r, () => o.group.position, { solid: spec.r * 1.3, arrive: spec.r * 4 + 40 });

  const planetsG = new THREE.Group(), orbitsG = new THREE.Group();
  o.group.add(planetsG, orbitsG);
  const planets = [];
  const n = opts.planets ? opts.planets.length : spec.n[0] + Math.floor(rnd() * (spec.n[1] - spec.n[0] + 1));
  let a = spec.r * 2.6 + 50;
  const letters = 'bcdefgh';
  for (let i = 0; i < n; i++) {
    a += (55 + rnd() * 90) * (1 + i * 0.18);
    let type = opts.planets && opts.planets[i];
    if (!type) {
      const r = rnd();
      if (a < spec.hot) type = r < 0.6 ? 'planet_lava' : 'planet_rocky';
      else if (a < spec.cold) type = r < 0.32 ? 'planet_earth' : r < 0.55 ? 'planet_ocean' : 'planet_rocky';
      else type = r < 0.58 ? 'planet_gas' : 'planet_ice';
    }
    const pl = makePlanet(type, rnd, uLight, { ring: opts.ringAll && type === 'planet_gas' });
    pl.a = a; pl.ang = rnd() * Math.PI * 2; pl.omega = 0.012 * Math.pow(100 / a, 1.5); pl.inc = (rnd() - 0.5) * 0.12;
    pl.name = sName + ' ' + letters[i];
    planetsG.add(pl.pivot);
    // moons
    pl.moons = [];
    const nm = type === 'planet_gas' ? Math.floor(rnd() * 3) : (rnd() < 0.35 ? 1 : 0);
    for (let k = 0; k < nm; k++) {
      const mp = makePlanet(rnd() < 0.5 ? 'planet_rocky' : 'planet_ice', rnd, uLight, { r: 0.6 + rnd() * 1.1 });
      mp.a = pl.r * (2.6 + k * 1.3 + rnd()); mp.ang = rnd() * 6.28; mp.omega = 0.05 + rnd() * 0.08;
      pl.pivot.add(mp.pivot); pl.moons.push(mp);
    }
    // orbit line
    const pts = [];
    for (let k = 0; k <= 160; k++) { const t = k / 160 * Math.PI * 2; pts.push(Math.cos(t) * a, Math.sin(t) * a * pl.inc, Math.sin(t) * a); }
    const og = new THREE.BufferGeometry(); og.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    orbitsG.add(new THREE.Line(og, new THREE.LineBasicMaterial({ color: 0x9fb4d8, transparent: true, opacity: 0.1, depthWrite: false })));
    planets.push(pl);
    addTarget(o, type, pl.name, pl.r, () => pl.rel, { solid: pl.r * 1.25, arrive: pl.r * 4 + 12, parent: sName, active: () => planetsG.visible });
  }
  // asteroid belt
  let belt = null;
  if (rnd() < 0.4 && planets.length >= 2) {
    const k = Math.floor(rnd() * (planets.length - 1));
    const aB = (planets[k].a + planets[k + 1].a) / 2, w = Math.min(30, (planets[k + 1].a - planets[k].a) * 0.18);
    belt = new THREE.Group();
    rockSwarm(Math.round(420 * Q), rnd, g, uLight, (p, s) => {
      const t = rnd() * Math.PI * 2, rr = aB + g() * w;
      p.set(Math.cos(t) * rr, g() * w * 0.15, Math.sin(t) * rr); s.setScalar(0.25 + Math.pow(rnd(), 3) * 1.6);
    }).forEach(m => belt.add(m));
    planetsG.add(belt);
    addTarget(o, 'asteroids', sName + ' belt', w * 2, () => o.group.position, { arrive: aB + 40, parent: sName, active: () => planetsG.visible });
  }
  // comet
  let comet = null;
  if (rnd() < 0.3 || opts.comet) {
    const ca = (planets.length ? planets[planets.length - 1].a : 300) * (0.75 + rnd() * 0.4);
    const cp = new THREE.Group();
    const nucleus = new THREE.Mesh(ROCKS[1], rockMaterial(uLight)); nucleus.scale.setScalar(1.3); cp.add(nucleus);
    cp.add(sprite(GLOW, '#bfe8ff', 18, 0.7));
    const tail = new THREE.Group(); cp.add(tail);
    const tb = new PB();
    for (let i = 0; i < 1600 * Q; i++) {
      const t = Math.pow(rnd(), 1.6), L = 260;
      const spread = 3 + t * 34;
      const ion = rnd() < 0.35;
      tb.add(g() * spread * (ion ? 0.25 : 1), g() * spread * (ion ? 0.25 : 1), t * L * (ion ? 1.25 : 1),
        2 + t * 9, (1 - t) * (ion ? 0.22 : 0.12), ion ? 0.45 : 0.85, ion ? 0.7 : 0.9, 1.0);
    }
    tail.add(tb.build(pmat({ soft: 1 }), 2));
    comet = { pivot: cp, tail, a: ca, ang: rnd() * 6.28, omega: 0.02 * Math.pow(100 / ca, 1.2), inc: (rnd() - 0.5) * 0.6, rel: V(0, 0, 0) };
    planetsG.add(cp);
    addTarget(o, 'comet', nameWord(rnd) + ' comet', 2, () => comet.rel, { arrive: 40, parent: sName, active: () => planetsG.visible });
  }
  // space billboards next to some planets (always at least one per system)
  const must = Math.floor(rnd() * planets.length);
  planets.forEach((pl, i) => {
    if (i === must || rnd() < 0.3) addBillboard(o, pl.pivot, V(pl.r * 4.4, pl.r * 1.9, -pl.r * 1.2), Math.max(pl.r * 2.3, 8), rnd, () => planetsG.visible);
  });
  const tmp = V(0, 0, 0), Z = V(0, 0, 1);
  o.planets = planets;
  o.update = (dt, t, dist) => {
    uLight.value.copy(o.group.position);
    star.mesh.rotation.y += dt * 0.02;
    const near = dist < 3000;
    planetsG.visible = near; orbitsG.visible = dist < 4200;
    if (!near) return;
    for (const p of planets) {
      p.ang += p.omega * dt;
      p.pivot.position.set(Math.cos(p.ang) * p.a, Math.sin(p.ang) * p.a * p.inc, Math.sin(p.ang) * p.a);
      p.body.rotation.y += dt * p.spin;
      if (p.clouds) p.clouds.rotation.y += dt * p.spin * 1.25;
      p.rel.copy(o.group.position).add(p.pivot.position);
      if (p.ringMat) p.ringMat.uniforms.uPlanet.value.copy(p.rel);
      for (const m of p.moons) { m.ang += m.omega * dt; m.pivot.position.set(Math.cos(m.ang) * m.a, Math.sin(m.ang) * m.a * 0.15, Math.sin(m.ang) * m.a); }
    }
    if (belt) belt.rotation.y += dt * 0.004;
    if (comet) {
      comet.ang += comet.omega * dt;
      comet.pivot.position.set(Math.cos(comet.ang) * comet.a, Math.sin(comet.ang) * comet.a * comet.inc, Math.sin(comet.ang) * comet.a);
      tmp.copy(comet.pivot.position).normalize();
      comet.tail.quaternion.setFromUnitVectors(Z, tmp);
      comet.rel.copy(o.group.position).add(comet.pivot.position);
    }
  };
  return finalize(o);
};

B.nebula = function (c, rnd, g) {

        const t = Math.min(1, r / (R * 0.6));

    for (let i = 0; i < 900 * Q; i++) { const r = R * (0.1 + Math.pow(rnd(), 0.8) * 0.72), k = Math.floor(rnd() * opt.arms), th = armAngle(r, k) - 0.1 + g() * 0.1; dust.add(Math.cos(th) * r, g() * R * 0.003, Math.sin(th) * r, R * (0.02 + rnd() * 0.03), 0.18 + rnd() * 0.16, 0.045, 0.03, 0.025); }

function blackHoleCore(o, S, rnd, hot) {

      void main(){

        float streak=snoise(vec3(q*0.9,r*1.4))*0.5+0.5;

        b*=1.0+0.8*dot(vTan,normalize(cameraPosition-vWorld));

    side: THREE.DoubleSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending

    vertexShader: `varying vec2 vP; void main(){ vP=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader: NOISE + `uniform vec3 uCol; uniform float uFade; varying vec2 vP;

    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending

}

  const rnd = mulberry32(cellSeed(cx, cy, cz));
  const g = gaussian(rnd);
  const center = V((cx + 0.5) * CELL, (cy + 0.5) * CELL, (cz + 0.5) * CELL);
  const pos = center.clone().add(V((rnd() - 0.5) * CELL * 0.5, (rnd() - 0.5) * CELL * 0.5, (rnd() - 0.5) * CELL * 0.5));
  if (FORCED.has(key)) { const f = FORCED.get(key); return { kind: f.kind, pos: f.pos, rnd, g, opts: f.opts }; }
  if (OVERRIDE[key]) { const ov = OVERRIDE[key]; return { kind: ov.kind, pos: ov.center ? center : pos, rnd, g, opts: ov.opts }; }
  let r = rnd() * KSUM, kind = 'empty';
  for (const [k, w] of KINDS) { if ((r -= w) <= 0) { kind = k; break; } }
  return { kind, pos, rnd, g };
}

const ship = { pos: V(0, 0, 0), quat: new THREE.Quaternion(), speed: 0, vel: V(0, 0, 0), throttle: 0.18, boost: 1 };
const loaded = new Map();   // key -> obj | null
let objs = [];
let queue = [], lastCellKey = '';
function cellOf(p) { return [Math.floor(p.x / CELL), Math.floor(p.y / CELL), Math.floor(p.z / CELL)]; }
function refreshCells(force) {
  const [cx, cy, cz] = cellOf(ship.pos);
  const key = cx + ',' + cy + ',' + cz;
  if (!force && key === lastCellKey) return;
  lastCellKey = key;
  for (const [k, o] of loaded) {
    const [x, y, z] = k.split(',').map(Number);
    if (Math.max(Math.abs(x - cx), Math.abs(y - cy), Math.abs(z - cz)) > RAD + 1) { if (o) unload(o); loaded.delete(k); }
  }
  const want = [];
  for (let dx = -RAD; dx <= RAD; dx++) for (let dy = -RAD; dy <= RAD; dy++) for (let dz = -RAD; dz <= RAD; dz++) {
    const k = (cx + dx) + ',' + (cy + dy) + ',' + (cz + dz);
    if (!loaded.has(k)) want.push({ k, x: cx + dx, y: cy + dy, z: cz + dz, d: dx * dx + dy * dy + dz * dz });
  }
  want.sort((a, b) => a.d - b.d);

}
function unload(o) {

}
function processQueue(budget) {
  const t0 = performance.now();
  const [cx, cy, cz] = cellOf(ship.pos);
  while (queue.length && performance.now() - t0 < budget) {
    const it = queue.shift();
    if (loaded.has(it.k)) continue;
    if (Math.max(Math.abs(it.x - cx), Math.abs(it.y - cy), Math.abs(it.z - cz)) > RAD) continue;
    const c = cellContent(it.x, it.y, it.z);
    let o = null;
    if (c.kind !== 'empty' && B[c.kind]) {
      try { o = B[c.kind](c.pos, c.rnd, c.g, c.opts); } catch (e) { console.error(e); o = null; }

}
function placeObj(o) {

  o.dist = o.group.position.length();
}

// Uses the free Abacus counting API. It works on normal web hosting (like GitHub Pages);
// inside the claude.ai preview outside connections are blocked, so the counter simply stays hidden.
const COUNTER_API = 'https://abacus.jasoncameron.dev';
const COUNTER_NS = 'space-exploration-game-q7k2x9';
async function counterCall(verb, key) {
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const tm = setTimeout(() => { if (ctl) ctl.abort(); }, 7000);
  try {
    const r = await fetch(COUNTER_API + '/' + verb + '/' + COUNTER_NS + '/' + key, { cache: 'no-store', signal: ctl ? ctl.signal : undefined });
    if (r.status === 404) return { missing: true };
    if (!r.ok) return null;
    const j = await r.json();
    return typeof j.value === 'number' ? { value: j.value } : null;
  } catch (e) { return null; } finally { clearTimeout(tm); }
}
function showVisitors(n) {
  const txt = Number(n).toLocaleString('en-US');
  $('visCount').textContent = txt; $('visChip').hidden = false;
  $('introVisNum').textContent = txt; $('introVis').hidden = false;
  $('msVisitors').textContent = txt; $('menuStats').hidden = false;
}
(async function countVisit() {
  let seen = false;
  try { seen = !!localStorage.getItem('space-exploration-visitor'); } catch (e) {}
  let v = await counterCall(seen ? 'get' : 'hit', 'visitors');
  if (v && v.missing) v = await counterCall('hit', 'visitors');
  if (v && typeof v.value === 'number') {
    if (!seen) { try { localStorage.setItem('space-exploration-visitor', '1'); } catch (e) {} }
    showVisitors(v.value);
    const f = await counterCall('hit', 'visits');
    if (f && typeof f.value === 'number') $('msVisits').textContent = f.value.toLocaleString('en-US');
  }
})();

const Snd = {
  ctx: null, on: true,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = this.ctx = new AC();
    const master = this.master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.setTargetAtTime(this.on ? 0.8 : 0, ctx.currentTime, 1.2);
    const lp = this.lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 200; lp.Q.value = 0.8;
    const dg = ctx.createGain(); dg.gain.value = 0.045;
    this.oscs = [[55, 'sawtooth', 0.5], [55.35, 'sawtooth', 0.5], [82.4, 'sine', 0.7]].map(([f, ty, gv]) => {
      const o = ctx.createOscillator(); o.type = ty; o.frequency.value = f; const g = ctx.createGain(); g.gain.value = gv; o.connect(g); g.connect(lp); o.start(); return o;
    });
    lp.connect(dg); dg.connect(master);
    const len = ctx.sampleRate * 3, buf = ctx.createBuffer(1, len, ctx.sampleRate), data = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; data[i] = last * 3.5; }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const nf = this.nf = ctx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 150;
    const ng = this.ng = ctx.createGain(); ng.gain.value = 0.06;
    src.connect(nf); nf.connect(ng); ng.connect(master); src.start();
  },
  set(x, jumpEnv) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, e = Math.max(x, jumpEnv);
    this.nf.frequency.setTargetAtTime(140 + e * 1500, t, 0.1);
    this.ng.gain.setTargetAtTime(0.05 + e * 0.2, t, 0.1);
    this.lp.frequency.setTargetAtTime(180 + e * 500, t, 0.1);
    this.oscs[0].frequency.setTargetAtTime(55 * (1 + e * 0.5), t, 0.2);
    this.oscs[1].frequency.setTargetAtTime(55.35 * (1 + e * 0.5), t, 0.2);
  },
  toggle() {
    this.on = !this.on;
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); this.master.gain.setTargetAtTime(this.on ? 0.8 : 0, this.ctx.currentTime, 0.3); }
    $('miSoundVal').textContent = this.on ? 'On' : 'Off';
  }
};

    const rollIn = (keys.KeyQ ? 1 : 0) - (keys.KeyE ? 1 : 0);
    const k = Math.min(1, dt * 6);
    rot.y += (yawIn * 1.0 - rot.y) * k; rot.x += (pitchIn * 0.9 - rot.x) * k; rot.z += (rollIn * 1.3 - rot.z) * k;
    if (Math.abs(rot.y) + Math.abs(rot.x) + Math.abs(rot.z) > 0.001) rotateShip(rot.y * dt, rot.x * dt, rot.z * dt);
    if (yawIn || pitchIn || rollIn) { if (auto) setAuto(null); }
    if (keys.KeyW) { setThrottle(ship.throttle + dt * 0.28); if (auto) setAuto(null); }
    if (keys.KeyS) { setThrottle(ship.throttle - dt * 0.35); if (auto) setAuto(null); }
  }
  ship.boost += (((keys.ShiftLeft || keys.ShiftRight) && launched && !auto ? 8 : 1) - ship.boost) * Math.min(1, dt * 3);

  // autopilot
  let want = speedFromThrottle(ship.throttle) * ship.boost;
  if (!launched) want = 0.2;
  if (auto && !jump) {
    const r = auto.rel(), d = r.length(), dir = r.clone().divideScalar(Math.max(d, 1e-6));
    upV.set(0, 1, 0).applyQuaternion(ship.quat);
    lookM.lookAt(ORIGIN, dir, upV); tmpQ.setFromRotationMatrix(lookM);
    ship.quat.slerp(tmpQ, 1 - Math.exp(-dt * 2.4));
    fwdV.set(0, 0, -1).applyQuaternion(ship.quat);
    const facing = fwdV.dot(dir), remain = d - auto.arrive;
    if (remain <= 1.5) {
      toast('<b>Arrived:</b> ' + esc(auto.name), 3000);
      if (!auto.visited) { auto.visited = true; if (!auto.bb) addXP(15, 'arrived'); }
      setAuto(null); setThrottle(0); want = 0;
    } else {
      want = clamp(remain * 0.9, 0.6, 60000) * smooth(0.75, 0.97, facing);
      setThrottle(throttleFromSpeed(want));
    }
  }
  const k = want > ship.speed ? 1.7 : 3.2;
  ship.speed += (want - ship.speed) * (1 - Math.exp(-dt * k));
  if (want === 0 && ship.speed < 0.03) ship.speed = 0;
  if (auto) ship.speed = Math.min(ship.speed, Math.max(0.6, (auto.rel().length() - auto.arrive) * 1.6));

  // hyperjump
  let streakI = 0, streakS = 0, flashA = 0, jumpEnv = 0;
  if (jump) {
    jump.p = Math.min(1, jump.p + dt / jump.dur);
    const p = jump.p; jumpEnv = Math.pow(Math.sin(Math.PI * p), 2);
    streakI = clamp(jumpEnv * 1.6, 0, 1) * (reduceMotion ? 0.5 : 0.9);
    streakS = 60 + 1400 * jumpEnv;
    flashA = reduceMotion ? 0 : Math.exp(-Math.pow((p - 0.5) / 0.06, 2)) * 0.92;
    if (!jump.swapped && p >= 0.5) { jump.swapped = true; doJumpSwap(); }
    if (p >= 1) {
      const w = jump.worm; jump = null;
      jumpReady = U_TIME.value + JUMP_COOLDOWN;
      toast(w ? '<b>You came out of the wormhole!</b><br>Somewhere completely new.' : '<b>Hyperjump complete.</b><br>New region ahead. Look around.', 4200);
      addXP(w ? 50 : 5, w ? 'wormhole' : 'jump');
    }
  }

  // move
  fwdV.set(0, 0, -1).applyQuaternion(ship.quat);
  ship.vel.copy(fwdV).multiplyScalar(ship.speed);
  ship.pos.addScaledVector(ship.vel, dt);
  if (!jump || jump.swapped) refreshCells(false);

  // place everything relative to the ship (camera stays at the origin)
  for (const o of objs) {
    placeObj(o);
    const f = 1 - smooth(FADE0, FADE1, o.dist);
    applyFade(o, f);
    if (o.group.visible && o.update) o.update(dt, U_TIME.value, o.dist);
  }
  // billboards always turn to face the ship
  for (const o of objs) {
    if (!o.group.visible || !o.billboards) continue;
    for (const bb of o.billboards) {
      const u = bb.userData;
      if (u.active && !u.active()) continue;
      bb.parent.getWorldQuaternion(qW);
      bb.quaternion.copy(qW.invert()).multiply(ship.quat);
      bb.getWorldPosition(u.rel);
    }
  }
  // keep out of stars and planets, and warn when close to danger
  let warn = '';
  for (const o of objs) {
    if (!o.group.visible) continue;
    for (const t of o.targets) {
      if (!t.solid || (t.active && !t.active())) continue;
      const r = t.rel(), d = r.length();
      if ((t.typeKey === 'blackhole' || t.typeKey === 'quasar') && d < t.solid * 4) warn = 'Gravity warning';
      else if (!warn && t.typeKey.startsWith('star_') && d < t.solid * 1.9) warn = 'Heat warning';
      if (d < t.solid && d > 1e-4) {
        ship.pos.addScaledVector(r, -(t.solid - d) / d);
        if (ship.speed > 5 && !auto) setThrottle(throttleFromSpeed(5));
      }
    }
  }
  if (!launched || jump) warn = '';
  if (warn !== alertTxt) { alertTxt = warn; const a = $('alert'); a.textContent = warn; a.classList.toggle('on', !!warn); }

  dust.update(dt, ship.vel, ship.speed);
  streaks.update(dt, streakS, streakI);
  $('flash').style.opacity = flashA.toFixed(3);

  camera.quaternion.copy(ship.quat);
  const fov = baseFov + clamp(Math.log10(Math.max(ship.speed, 1) / 400) / 1.7, 0, 1) * 14 + jumpEnv * 26;
  if (Math.abs(camera.fov - fov) > 0.02) { camera.fov = fov; camera.updateProjectionMatrix(); }
  U_SCALE.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));

  Snd.set(clamp(Math.log10(ship.speed + 1) / 4.6, 0, 1), jumpEnv);
  if (launched && frameN % 3 === 0) { updateScanner(false); updateSpeedHud(); }

  if (gfxHigh && composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
